<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password · Smart Solar Platform</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth-wrap">
    <div class="glass auth-card">
      <a href="index.html" class="brand" style="margin-bottom:22px"><span class="brand-mark"></span>Smart Solar</a>
      <h1>Reset password</h1>
      <p class="muted">Enter your registered email. In this demo, no email is actually sent.</p>
      <form id="forgot-form" novalidate>
        <div class="form-error"></div>
        <div class="field"><label for="forgot-email">Email</label><input id="forgot-email" name="email" type="email" autocomplete="email"><div class="field-error" data-error="email"></div></div>
        <button class="btn btn-primary btn-block" type="submit">Send reset link</button>
        <p id="forgot-msg" class="success-msg"></p>
      </form>
      <p class="auth-switch"><a href="login.html" style="color:var(--accent2);font-weight:600">Back to log in</a></p>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
