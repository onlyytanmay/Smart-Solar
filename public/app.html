<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dashboard · Smart Solar Platform</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar glass">
      <a href="index.html" class="brand"><span class="brand-mark"></span>Smart Solar</a>
      <nav class="nav" id="nav" aria-label="Main navigation"></nav>
      <div class="user-chip">
        <div class="avatar" id="user-initial">·</div>
        <div class="meta"><strong id="user-name">Loading…</strong><span id="user-meta"></span></div>
      </div>
    </aside>

    <div class="main-col">
      <header class="topbar glass">
        <h1 id="page-title">Dashboard</h1>
        <div class="right">
          <span class="demo-tag">DEMO · SIMULATED</span>
          <a class="btn btn-ghost btn-sm bell" href="#notifications" aria-label="Notifications">
            🔔 <span class="bell-count" id="bell-count" data-zero="true"></span>
          </a>
          <button class="btn btn-danger btn-sm" id="logout-btn" type="button">Log out</button>
        </div>
      </header>
      <div class="content" id="main"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/simulation.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
